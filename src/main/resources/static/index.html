<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sistema de Mantenimiento de Vehículos</title>

<style>

*{
    box-sizing: border-box;
}

body{
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#1f2937,#111827);
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    width:380px;
    padding:40px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    text-align:center;
}

h1{
    margin-bottom:10px;
    color:#111827;
}

.subtitle{
    font-size:14px;
    color:#6b7280;
    margin-bottom:30px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #d1d5db;
    font-size:14px;
}

input:focus{
    outline:none;
    border-color:#3b82f6;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    font-size:15px;
    cursor:pointer;
    margin-top:10px;
}

.login{
    background:#3b82f6;
    color:white;
}

.login:hover{
    background:#2563eb;
}

.register{
    background:#10b981;
    color:white;
}

.register:hover{
    background:#059669;
}

.footer{
    margin-top:20px;
    font-size:12px;
    color:#9ca3af;
}

</style>
</head>

<body>

<div class="container">

<h1>Sistema de Vehículos</h1>
<p class="subtitle">Gestión de mantenimientos de taller mecánico</p>

<form>

<input type="text" placeholder="Usuario" required>

<input type="password" placeholder="Contraseña" required>

<button class="login">Iniciar sesión</button>

<button class="register" type="button">Registrarse</button>

</form>

<div class="footer">
Sistema de mantenimiento v1.0
</div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en"
  xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Inventario</title>
    <!-- Importar Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .product-form {
            max-width: 400px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0px 0px 10px 0px rgba(0,0,0,0.1);
        }

        .product-form label {
            display: block;
            margin-bottom: 5px;
        }

        .product-form input[type="text"],
        .product-form input[type="number"],
        .product-form textarea {
            width: calc(100% - 12px);
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .product-form textarea {
            height: 100px;
        }

        .product-form button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
        }

        .product-form button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
 
     <div class="container">
        <h1 class="text-center my-4">Usuarios</h1>
            
            <a class="btn btn-primary" href="/usuarios/crear">Crear usuarios</a> 
         
            <h2>Contenido de la Lista en Forma de Tabla</h2>

            <div class="container">
                 
                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col">Id</th>
                            <th scope="col">Login</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Contraseña</th>
                            <th scope="col">Activo</th>
                            
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${usuarios}">
                            <td scope="row" th:text="${p.usuariosId}"></td>
                            <td scope="row" th:text="${p.login}"></td>
                            <td scope="row" th:text="${p.nombre}"></td>
                            <td scope="row" th:text="${p.Contrasena}"></td>
                            <td scope="row" th:text="${p.enabled}"></td>
                             
                        </tr>
                       
                    </tbody>
                </table>
            </div>
    </div>

    <!-- Importar Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>


</html>

<!DOCTYPE html>
<html lang="en"
  xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Inventario</title>
    <!-- Importar Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container"> 
        <div class="row"> 
          <div class="col-md-8 mx-auto rounded border p-4 m-4">
             <h1 class="text-center my-4">Crear Usuarios</h1>
                <form  th:object="${usuariosDto}"  method="post">
                    
                    <div class="row mb-3">
                        <label for="login" class="col-sm-4 col-form-label">Codigo</label>
                        <div class="col-sm-8">
                          <input th:field="${usuariosDto.login}" class="form-control" id="login"></input>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <label for="contrasena" class="col-sm-4 col-form-label">Contraseña</label>
                        <div class="col-sm-8">
                          <input th:field="${usuariosDto.contrasena}" class="form-control" id="contrasena"></input>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <label for="nombre" class="col-sm-4 col-form-label">Nombre</label>
                        <div class="col-sm-8">
                          <input th:field="${usuariosDto.nombre}" class="form-control" id="nombre"></input>
                        </div>
                    </div>
                     
 
                    <div class="row">
                        <div class="offset-sm-4 col-sm-4 d-grid" >
                            <button type="submit" class="btn btn-primary">Guardar</button>
                        </div>
                        <div class="col-sm-4 d-grid" >
                            <a class="btn btn-outline-primary" href="/usuarios">Cancelar</a>
                        </div>
                    </div>

                </form>
          </div>

        </div>

    </div>

    <!-- Importar Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>


</html>

<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Inventario</title>
    <!-- Importar Bootstrap CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <h1 class="text-center my-4">Productos</h1>
      <a class="btn btn-primary" href="/productos/crear">crear productos</a>
      <a class="btn btn-primary" href="/productos/exportarExcel"
        >Exportar excel</a
      >
      <a class="btn btn-primary" href="/productos/exportarPDF">Exportar pdf</a>
      <div th:if="${mensaje!=null}" th:class="'alert alert-' + ${clase}">
        <span th:text="${mensaje}"> </span>
        <button
          th:if="${mensaje!=null}"
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
          aria-label="Close"
        ></button>
      </div>

      <table class="table">
        <thead>
          <tr>
            <th scope="col">Id</th>
            <th scope="col">Codigo</th>
            <th scope="col">Fecha</th>
            <th scope="col">Nombre</th>
            <th scope="col">Precio</th>
            <th scope="col">descripcion</th>
            <th scope="col">observacion</th>
            <th scope="col">Saldo minimo</th>
            <th scope="col">Saldo maximo</th>
            <th scope="col">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${productos!=null}" th:each="p : ${productos}">
            <td scope="row" th:text="${p.productoId}"></td>
            <td scope="row" th:text="${p.codigo}"></td>
            <td scope="row" th:text="${p.fechaCreacion}"></td>
            <td scope="row" th:text="${p.nombre}"></td>
            <td scope="row" th:text="${p.Precio}"></td>
            <td scope="row" th:text="${p.descripcion}"></td>
            <td scope="row" th:text="${p.observacion}"></td>
            <td scope="row" th:text="${p.saldoMinimo}"></td>
            <td scope="row" th:text="${p.saldoMaximo}"></td>
            <td scope="row" style="white-space: nowrap">
              <a
                th:href="@{/productos/editar/}+${p.productoId}"
                class="btn btn-primary btn-sm"
                >Editar</a
              >
              <a
                th:href="@{/productos/eliminar/}+${p.productoId}"
                onclick="
                  return confirm(
                    'Esta seguro que quiere eliminar este producto',
                  );
                "
                class="btn btn-danger btn-sm"
                >Eliminar</a
              >
            </td>
          </tr>
        </tbody>
      </table>

      <h1>Generar Reporte de Producto</h1>
      <form
        th:action="@{/productos/exportarPDFVer2}"
        method="get"
        target="_blank"
      >
        <label for="codigoProducto">Código del Producto:</label>
        <input type="text" id="codigoProducto" name="codigoProducto" required />
        <button type="submit" class="btn btn-primary">Generar Reporte</button>
      </form>
    </div>

    <!-- Importar Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
